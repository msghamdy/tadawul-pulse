<html lang="en" dir="ltr">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Systematic research on the Saudi stock market (TASI): oil sensitivity, factors, seasonality and pairs." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Tadawul Pulse</title>
    <script>
      // Apply the saved language before first paint to avoid a layout flash.
      try {
        var l = localStorage.getItem("tp-lang");
        if (l === "ar") { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
